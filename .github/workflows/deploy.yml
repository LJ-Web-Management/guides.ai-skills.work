name: Validate and deploy the Field Guide

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Read the configured Pages URL
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v6
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium for browser validation
        run: npx playwright install --with-deps chromium
      - name: Build and validate
        run: npm run check
      - name: Build for the deployment URL
        if: github.event_name != 'pull_request'
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
      - name: Validate deployment paths and discovery resources
        if: github.event_name != 'pull_request'
        run: npm test
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
