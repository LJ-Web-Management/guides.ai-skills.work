name: Validate and publish the Field Guide

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate the application
        run: npm run check
      - name: Build for the live GitHub Pages URL
        if: github.event_name != 'pull_request'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://lj-web-management.github.io/guides.ai-skills.work' }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: npm run build && npm test
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: static-site
          path: dist
          include-hidden-files: true
          retention-days: 3

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v7
        with:
          name: static-site
          path: dist
      - name: Publish generated pages to the configured main branch root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-root.mjs --stage
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Publish generated GitHub Pages site [skip ci]'
            git push origin main
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
          fi
      - name: Verify this release on the live website
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://lj-web-management.github.io/guides.ai-skills.work' }}
        run: |
          export EXPECTED_RELEASE=$(node -p 'JSON.parse(require("fs").readFileSync(".pages-root-manifest.json","utf8")).release')
          node scripts/verify-live.mjs "$SITE_URL"
